<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Aakash S S</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
    html { background-color: #F4F0E6; color: #1A1A1A; font-family: 'Inter', -apple-system, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
    .error-code { font-family: 'Space Grotesk', sans-serif; font-size: clamp(80px, 20vw, 160px); font-weight: 800; line-height: 1; letter-spacing: -4px; color: #1A1A1A; margin-bottom: 8px; }
    .error-code span { color: #FF4D4D; }
    .error-message { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 4vw, 40px); font-weight: 700; margin-bottom: 16px; letter-spacing: -1px; }
    .error-desc { font-size: 16px; color: #555555; line-height: 1.6; max-width: 460px; margin-bottom: 32px; }
    .error-desc code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(26,26,26,0.06); border: 1px solid #DCD8CE; padding: 2px 6px; }
    .btn-home { display: inline-flex; align-items: center; justify-content: center; height: 48px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; padding: 0 28px; background-color: #D4FF33; border: 1px solid #1A1A1A; color: #1A1A1A; text-decoration: none; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .btn-home:hover { transform: translate(-3px, -3px); box-shadow: 3px 3px 0px #1A1A1A; }
    .footer-note { margin-top: 48px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888888; }
  </style>
</head>
<body>
  <div class="error-code">4<span>0</span>4</div>
  <h1 class="error-message">Page not found.</h1>
  <p class="error-desc">
    The page you're looking for doesn't exist or has been moved. If you were looking for something specific, try starting from the homepage.
  </p>
  <a href="/" class="btn-home">Back to Home &gt;</a>
  <div class="footer-note">© 2026 Aakash S S</div>
</body>
</html>
